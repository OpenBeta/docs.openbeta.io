[build]
builder = "NIXPACKS"
nixpacksPlan = { providers = ["...", "node"] }
nixpacksConfigPath = "nixpacks.toml"

[deploy]
runtime = "V2"
numReplicas = 1
limitOverride = { containers = { cpu = 1, memoryBytes = 80000000 }}
sleepApplication = false
multiRegionConfig = {"us-east4-eqdc4a" = {"numReplicas" = 1}}
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[environments.pr.deploy]
sleepApplication = true
numReplicas = 1
limitOverride = { containers = { cpu = 0.5, memoryBytes = 50000000 } }
